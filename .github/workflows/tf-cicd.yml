name: "Terraform CI/CD"

on:
  pull_request:
    branches: [develop, main, release]
    paths:
      - 'environments/dev/**'
      - 'environments/stg/**'
      - 'environments/prd/**'
      - 'modules/**'
  push:
    branches: [develop, main, release]
    paths:
      - 'environments/dev/**'
      - 'environments/stg/**'
      - 'environments/prd/**'
      - 'modules/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: "ap-northeast-1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  # Snowflake
  TF_VAR_snowflake_account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  TF_VAR_snowflake_user: ${{ secrets.SNOWFLAKE_USER }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: "Terraform Plan / Apply"
    runs-on: ubuntu-latest

    # ブランチ名から対象 Environment を決定
    environment: >-
      ${{ github.ref_name == 'main' && 'prd' || 
          github.ref_name == 'release' && 'stg' || 'dev' }}

    defaults:
      run:
        # ディレクトリも同様にマッピング
        working-directory: environments/${{ vars.ENV_DIR_NAME }} 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if base branch is stg and source branch is dev
        if: github.base_ref == 'main' && github.head_ref != 'develop'
        run: |
          echo "Error: Pull Requests to 'main' must come from 'develop' branch."
          exit 1

      - name: Check if base branch is release and source branch is stg
        if: github.base_ref == 'release' && github.head_ref != 'main'
        run: |
          echo "Error: Pull Requests to 'release' must come from 'main' branch."
          exit 1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        id: init
        run: terraform init -upgrade -no-color

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Comment PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan 📖 \`${process.env.PLAN_OUTCOME}\`
            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${process.env.PLAN_STDOUT}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        id: apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: terraform apply -auto-approve -no-color

      - name: Find Pull Request Number
        if: github.event_name == 'push'
        id: find_pr
        uses: jwalton/gh-find-current-pr@v1
        with:
          state: closed

      - name: Post Apply Result to Pull Request
        if: github.event_name == 'push' && steps.find_pr.outputs.number != ''
        uses: actions/github-script@v7
        env:
          APPLY_STDOUT: ${{ steps.apply.outputs.stdout }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Apply Result: \`${process.env.APPLY_OUTCOME}\`

            <details><summary>Show Apply Output</summary>

            \`\`\`terraform
            ${process.env.APPLY_STDOUT}
            \`\`\`

            </details>

            *Action: \`terraform apply\` after merge by @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: parseInt("${{ steps.find_pr.outputs.number }}"),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
